# The typecheck and the tests, on every pull request and push to main, on
# Linux and Windows, and the build on Linux (the job is tests.yml). The
# clean-machine check (npm run smoke:release) is left to the release workflow,
# which runs it on each version tag, to keep this quick.
#
# macOS runs the same job in a workflow of its own, ci-macos.yml, on the same
# pushes. It is apart because GitHub sometimes can't give a Mac runner in time
# and drops the job unstarted; apart, that shows on the commit as macOS's own
# result and doesn't turn this one red. This one is what a release checks.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # A failure on one system shouldn't hide what the other says.
      fail-fast: false
      matrix:
        include:
          # Each runner's own Chrome, for the diagram and page tests.
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: windows-latest
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ matrix.os }}
      chrome: ${{ matrix.chrome }}
