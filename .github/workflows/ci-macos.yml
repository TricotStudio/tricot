# The same typecheck and tests as CI (tests.yml), on macOS, on the same pull
# requests and pushes. A workflow of its own so that when GitHub can't give a
# Mac runner in time ("The job was not acquired by Runner of type hosted"),
# the dropped job shows here and CI (ci.yml), which a release checks, keeps
# saying what Linux and Windows found. A real failure here still shows on the
# commit, and is fixed like any other.
name: CI on macOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    with:
      os: macos-latest
      chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
